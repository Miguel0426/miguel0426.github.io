<!DOCTYPE html>
<html lang="en-US">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Volunteer Form></form></title>

	<!--Additional elements for browsers and robots go here-->

</head>

<body>
	<h1>Volunteer Form</h1>
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
    
    <fieldset>
        <legend>My Info</legend>

        <p>
            <label for ="first-name">:First Name:</label>
            <input type="text" id="first-name" name=""first_name_field">
        </p>

        <p>
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="last_name_field">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone_field">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email_field">
        </p>

        <p>Gender:</p>

        <input type="radio"
                id="male"
                name="gender_field"
                value="Male">
        <label for="male">Male</label>

        <input type="radio"
                id="female"
                name="gender_field"
                value="Female">
        <label for="female">Female</label>

        <p>
            <label for="age">Age:</label>

            <select id="age" name="age_field">
                <option value="under 18">under 18</option>
                <option value="over 18">over 18</option>
            </select>
        </p>
    </fieldset>

</body>

</html>
